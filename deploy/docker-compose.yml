# The whole system, locally, with one command.
#
#   cd D:\GITHUB\VH26-KalaDhua
#   docker compose -f deploy/docker-compose.yml up --build
#
# Build context is the repository root for every service, because the Dockerfiles copy from
# several top-level directories. Run compose from the root, not from deploy/.

name: aura

services:

  # ------------------------------------------------------------------ the cache
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    image: aura/engine:latest
    container_name: aura-engine
    # Exactly one replica, deliberately. Two engines mean two independent cache pools
    # behind one address: the hit rate halves, the capacity controller reasons about a
    # fraction of the traffic, and every benchmark number becomes meaningless. Sharding
    # needs the consistent-hash ring, not a replica count.
    deploy:
      replicas: 1
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      AURA__CACHE__CAPACITY_BYTES: ${AURA_CAPACITY_BYTES:-536870912}
      AURA__CAPACITY__HOST_BUDGET_BYTES: ${AURA_HOST_BUDGET_BYTES:-2147483648}
      AURA__CAPACITY__AUTO: "true"
      AURA__PREDICTOR__KIND: ${AURA_PREDICTOR:-gbdt}
    env_file:
      - ../backend/.env
    volumes:
      # Model bundles are written by the trainer and read by the engine. A named volume
      # rather than a bind mount, so a redeploy does not lose the active model.
      - models:/app/models
    # The pool is real memory under --real-values. Give the container a hard ceiling above
    # the logical capacity: metadata, allocator rounding and fragmentation measured ~1.5x.
    mem_limit: ${AURA_MEM_LIMIT:-2g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------ the applications
  recommendation:
    build: &apps_build
      context: ..
      dockerfile: deploy/Dockerfile.apps
    image: aura/apps:latest
    container_name: aura-recommendation
    command: ["python", "-m", "recommendation.main"]
    environment: &apps_env
      AURA_APPS_AURA_BASE_URL: http://engine:8080
      AURA_APPS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - ../backend/.env
    ports:
      - "8101:8101"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: *apps_build
    image: aura/apps:latest
    container_name: aura-analytics
    command: ["python", "-m", "analytics.main"]
    environment: *apps_env
    env_file:
      - ../backend/.env
    ports:
      - "8102:8102"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  content:
    build: *apps_build
    image: aura/apps:latest
    container_name: aura-content
    command: ["python", "-m", "content.main"]
    environment: *apps_env
    env_file:
      - ../backend/.env
    ports:
      - "8103:8103"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ correctness plane
  # Turns a write in the database into a cache invalidation. Deliberately a separate
  # process off the request path: an invalidation arriving 50 ms late is fine, a GET
  # blocked on a database round trip is not.
  invalidator:
    build: *apps_build
    image: aura/apps:latest
    container_name: aura-invalidator
    command: ["python", "-m", "invalidator.listener"]
    environment: *apps_env
    env_file:
      - ../backend/.env
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ the traffic
  # Off by default: `docker compose --profile load up` when you want it. The demo should
  # start quiet so the dashboard can be shown before the load is turned on.
  simulator:
    build: *apps_build
    image: aura/apps:latest
    container_name: aura-simulator
    profiles: ["load"]
    command:
      - python
      - -m
      - simulator.driver
      - --users=${SIM_USERS:-40000}
      - --rps=${SIM_RPS:-300}
      - --duration=${SIM_DURATION:-600}
      - --endpoint=recommendation=http://recommendation:8101
      - --endpoint=analytics=http://analytics:8102
      - --endpoint=content=http://content:8103
      - --aura-url=http://engine:8080
      - --log-file=/app/runs/requests.jsonl
    environment: *apps_env
    volumes:
      - runs:/app/runs
    depends_on:
      - recommendation
      - analytics
      - content
    restart: "no"

  # ------------------------------------------------------------------ the dashboard
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        # Baked into the bundle at build time. Point it at the engine as the *browser*
        # sees it, which is the host port, not the compose network name.
        VITE_AURA_URL: ${PUBLIC_AURA_URL:-http://localhost:8080}
    image: aura/dashboard:latest
    container_name: aura-dashboard
    ports:
      - "5173:80"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  runs:
