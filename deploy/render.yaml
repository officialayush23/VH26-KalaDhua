# Render blueprint: the cache and its console.
#
# The two example applications are deliberately not here. They run on your laptop against
# the public engine URL, which keeps the hosted surface to two services and lets you start
# and stop traffic during a demo. Their service definitions are at the bottom, commented,
# for when that changes.
#
# Render sets PORT and routes to nothing else, which is why the engine reads it rather than
# hardcoding 8080. Secrets marked sync:false are set once in the dashboard and never appear
# in the repository.

services:
  - type: web
    name: aura-engine
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.engine
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: RUST_LOG
        value: info

      # 64 MB of payload on a 512 MB instance. --real-values holds real bytes and the
      # measured overhead is about 1.5x, so this is roughly 100 MB resident before the
      # engine's own structures. The host-memory clamp will lower it further if the
      # instance has less free than that; it will not raise it.
      - key: AURA__CACHE__CAPACITY_BYTES
        value: "67108864"
      - key: AURA__CAPACITY__HOST_BUDGET_BYTES
        value: "134217728"
      - key: AURA__CAPACITY__AUTO
        value: "true"
      - key: AURA__PREDICTOR__KIND
        value: gbdt
      - key: AURA__PREDICTOR__SUPABASE_AUTOLOAD
        value: "true"

      # Anything with a public address runs enforced. Without SUPABASE_JWT_KEY the engine
      # refuses to start in this mode rather than accepting everyone.
      - key: AURA_AUTH
        value: enforced
      # The first account. Created on first boot, then persisted, so a recycled container
      # does not lose the only way in.
      - key: AURA_ROOT_EMAIL
        sync: false
      - key: AURA_ROOT_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_SECRET_KEY
        sync: false

  - type: web
    name: aura-console
    runtime: static
    rootDir: frontend/universe
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time, so changing one means a redeploy.
      - key: VITE_AURA_URL
        sync: false          # https://aura-engine-xxxx.onrender.com
    routes:
      # Single-page app: every path falls through to the one HTML file, or a refresh on any
      # panel returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

