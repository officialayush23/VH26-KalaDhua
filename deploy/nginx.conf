server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard is a single-page app: every route it owns has to fall through to the
    # one HTML file, or a refresh on any panel returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy leaves
    # browsers pinned to the previous bundle.
    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
